name: Capgen Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/*
      - neptune
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-tests:

    runs-on: ['self-hosted','neptune-org-atlantis']

    steps:
    - uses: actions/checkout@v4
    - name: Run unit tests
      run: |
        module use ${PWD}/modulefiles
        module load atlantis/llvm-20.1.5
        cd test
        ./run_fortran_tests.sh

